<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BlueprintEnvision</title>
  <script>
    // GitHub Pages SPA fallback — redirects all 404s back to index.html
    // preserving the path as a query parameter so the app can handle routing.
    var pathSegmentsToKeep = 1; // repo is served at /blueprint-exterior-visualizer/
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>
