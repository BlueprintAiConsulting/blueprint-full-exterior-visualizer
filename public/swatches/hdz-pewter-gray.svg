<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Base gradient -->
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgb(184,188,192)"/>
      <stop offset="35%" stop-color="rgb(146,150,154)"/>
      <stop offset="70%" stop-color="#868A8E"/>
      <stop offset="100%" stop-color="rgb(104,108,112)"/>
    </linearGradient>
    <!-- Tab shadow gradient (horizontal) -->
    <linearGradient id="shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgb(79,83,87)" stop-opacity="0.7"/>
      <stop offset="30%" stop-color="rgb(79,83,87)" stop-opacity="0"/>
      <stop offset="100%" stop-color="rgb(79,83,87)" stop-opacity="0"/>
    </linearGradient>
    <!-- Granule noise filter -->
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85 0.75" numOctaves="4" seed="2930" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blended"/>
      <feComponentTransfer in="blended">
        <feFuncA type="linear" slope="1"/>
      </feComponentTransfer>
    </filter>
    <!-- Subtle gloss overlay -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="white" stop-opacity="0"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background base -->
  <rect width="200" height="200" fill="url(#base)"/>

  <!-- Shingle rows — row 1 (top) -->
  <!-- Row 1 tabs -->
  <rect x="0"   y="0"  width="66" height="62" fill="rgb(184,188,192)" opacity="0.5" rx="1"/>
  <rect x="68"  y="0"  width="66" height="62" fill="rgb(146,150,154)"     opacity="0.4" rx="1"/>
  <rect x="136" y="0"  width="64" height="62" fill="rgb(162,166,170)"   opacity="0.45" rx="1"/>
  <!-- Row 1 shadow stripe at bottom -->
  <rect x="0" y="55" width="200" height="9" fill="rgb(79,83,87)" opacity="0.55"/>

  <!-- Row 2 tabs (offset by ~patternOffset) -->
  <rect x="-23" y="64" width="66" height="62" fill="rgb(146,150,154)"     opacity="0.4" rx="1"/>
  <rect x="45" y="64" width="66" height="62" fill="rgb(184,188,192)" opacity="0.45" rx="1"/>
  <rect x="113" y="64" width="66" height="62" fill="#868A8E"    opacity="0.35" rx="1"/>
  <rect x="181" y="64" width="66" height="62" fill="rgb(162,166,170)"   opacity="0.4" rx="1"/>
  <!-- Row 2 shadow stripe -->
  <rect x="0" y="119" width="200" height="9" fill="rgb(79,83,87)" opacity="0.55"/>

  <!-- Row 3 tabs -->
  <rect x="0"   y="128" width="66" height="72" fill="rgb(162,166,170)"   opacity="0.45" rx="1"/>
  <rect x="68"  y="128" width="66" height="72" fill="#868A8E"    opacity="0.35" rx="1"/>
  <rect x="136" y="128" width="64" height="72" fill="rgb(184,188,192)" opacity="0.5" rx="1"/>
  <!-- Row 3 shadow stripe -->
  <rect x="0" y="188" width="200" height="12" fill="rgb(79,83,87)" opacity="0.6"/>

  <!-- Vertical tab dividers -->
  <line x1="66"  y1="0"   x2="66"  y2="55"  stroke="rgb(79,83,87)" stroke-width="1.5" opacity="0.6"/>
  <line x1="134" y1="0"   x2="134" y2="55"  stroke="rgb(79,83,87)" stroke-width="1.5" opacity="0.6"/>
  <line x1="43" y1="64" x2="43" y2="119" stroke="rgb(79,83,87)" stroke-width="1.5" opacity="0.6"/>
  <line x1="111" y1="64" x2="111" y2="119" stroke="rgb(79,83,87)" stroke-width="1.5" opacity="0.6"/>
  <line x1="179" y1="64" x2="179" y2="119" stroke="rgb(79,83,87)" stroke-width="1.5" opacity="0.6"/>
  <line x1="66"  y1="128" x2="66"  y2="200" stroke="rgb(79,83,87)" stroke-width="1.5" opacity="0.6"/>
  <line x1="134" y1="128" x2="134" y2="200" stroke="rgb(79,83,87)" stroke-width="1.5" opacity="0.6"/>

  <!-- Granule texture overlay -->
  <rect width="200" height="200" fill="#868A8E" opacity="0.3" filter="url(#grain)"/>

  <!-- Top shadow (laminate thickness illusion) -->
  <rect width="200" height="200" fill="url(#shadow)"/>

  <!-- Gloss finish -->
  <rect width="200" height="200" fill="url(#gloss)"/>
</svg>